name: Validate

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@f6f29a7ee3fa0eccadf3620a7b9ee00ab54ec03b # master # zizmor: ignore[ref-version-mismatch] no semver tags; master branch only

  # Keep the required check and run HACS even when Hassfest fails. The validators
  # still run on separate runners; the HACS runner also reports their verdict.
  validate-success:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: validate-success
    if: always()
    needs: hassfest
    steps:
      - name: Run HACS validation
        id: hacs
        if: ${{ !cancelled() }}
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # Remove this 'ignore' key when you have added brand images for your integration to https://github.com/home-assistant/brands
          ignore: brands

      - name: Require both validations to pass
        if: always()
        env:
          HASSFEST: ${{ needs.hassfest.result }}
          HACS: ${{ steps.hacs.outcome }}
        run: |
          echo "Hassfest: ${HASSFEST}, HACS: ${HACS}"
          if [[ "$HASSFEST" != success || "$HACS" != success ]]; then
            exit 1
          fi
