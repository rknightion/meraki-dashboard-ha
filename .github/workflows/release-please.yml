name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # release-please creates releases and pushes release PRs
      pull-requests: write # release-please opens and updates release PRs
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Mints a short-lived GitHub App installation token scoped to THIS repo,
      # replacing RELEASE_PLEASE_TOKEN -- a PAT scoped across every rknightion repo.
      # Nothing durable is stored here to leak. The release PR's author becomes the
      # App rather than rknightion; CI still runs unattended on it, because the
      # action_required gate applies to github-actions[bot], not to bot identities
      # generally -- Renovate, a GitHub App, already runs fine.
      #
      # Releases now depend on camden being up, unsealed and on the tailnet; a
      # failure here is infrastructure, not the commit.
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@79a72d215e806c12876526ff30fbd524250e1bf9 # v1.17.1
        with:
          permission-set: release-please-meraki-dashboard-ha
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.bao.outputs.token }}

  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload release zip and edit release notes
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create integration zip
        run: |
          VERSION="${NEEDS_RELEASE_PLEASE_OUTPUTS_VERSION}"
          echo "Creating zip for version ${VERSION}"

          # Create zip from inside the integration directory
          cd "${{ github.workspace }}/custom_components/meraki_dashboard"
          zip -r "meraki_dashboard.zip" ./ -x "*.pyc" "*/__pycache__/*" "*/.DS_Store"

          # Move zip back to workspace
          mv "meraki_dashboard.zip" "${GITHUB_WORKSPACE}/"
        env:
          NEEDS_RELEASE_PLEASE_OUTPUTS_VERSION: ${{ needs.release-please.outputs.version }}

      - name: Upload zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG_NAME="${NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME}"
          ZIP_FILE="meraki_dashboard.zip"

          echo "Uploading ${ZIP_FILE} to release ${TAG_NAME}"

          gh release upload "${TAG_NAME}" "${ZIP_FILE}" --clobber

      - name: Comment on release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG_NAME="${NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME}"

          gh release view "${TAG_NAME}" --json body -q '.body' > release_body.txt

          cat >> release_body.txt <<EOF

          ---

          ## Installation

          Download \`meraki_dashboard.zip\` and extract to your Home Assistant \`custom_components\` directory.

          Or use HACS to install this integration.
          EOF

          gh release edit "${TAG_NAME}" --notes-file release_body.txt
